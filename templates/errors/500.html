{% extends 'base.html' %}

{% block title %}Erro interno - {{ app_name }}{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center">
    <div class="text-center">
        <h1 class="text-6xl font-bold text-gray-900 mb-4">500</h1>
        <p class="text-2xl font-semibold text-gray-700 mb-2">Erro interno do servidor</p>
        <p class="text-gray-600 mb-8">Ocorreu um erro inesperado. Por favor, tente novamente mais tarde.</p>
        <a href="{{ url_for('dashboard.index') }}" 
           class="inline-flex items-center gap-2 px-6 py-3 bg-green-500 text-white font-medium rounded-lg hover:bg-green-600 transition-all">
            <i class="fas fa-home"></i>
            Voltar ao Dashboard
        </a>
    </div>
</div>

{% endblock %}
