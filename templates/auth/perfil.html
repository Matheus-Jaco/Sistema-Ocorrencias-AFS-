{% extends "base.html" %}

{% block title %}Meu Perfil - Sistema de Ocorrências Escolares AFS{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Meu Perfil</h1>
            <p class="text-gray-600 mt-2">Gerenciar informações de conta</p>
        </div>
        
        <!-- Perfil Card -->
        <div class="bg-white rounded-lg shadow p-8 space-y-6">
            <form method="POST" action="{{ url_for('auth.perfil') }}" class="space-y-5">
                <!-- Nome -->
                <div>
                    <label for="nome_completo" class="block text-sm font-medium text-gray-700 mb-2">
                        Nome Completo
                    </label>
                    <input
                        type="text"
                        id="nome_completo"
                        name="nome_completo"
                        value="{{ professor.nome_completo }}"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                    >
                </div>
                
                <!-- Email (read-only) -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        value="{{ professor.email }}"
                        disabled
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-500"
                    >
                </div>
                
                <!-- Role (read-only) -->
                <div>
                    <label for="nivel" class="block text-sm font-medium text-gray-700 mb-2">
                        Nível de Acesso
                    </label>
                    <input
                        type="text"
                        id="nivel"
                        value="{% if professor.is_admin() %}Administrador{% else %}Professor{% endif %}"
                        disabled
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-500"
                    >
                </div>
                
                <!-- Submit -->
                <div class="pt-4">
                    <button
                        type="submit"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition"
                    >
                        Salvar Alterações
                    </button>
                </div>
            </form>
            
            <!-- Links -->
            <div class="pt-4 border-t border-gray-200 space-y-2">
                <a href="{{ url_for('auth.alterar_senha') }}" class="block text-green-600 hover:text-green-700 font-medium">
                    → Alterar Senha
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
