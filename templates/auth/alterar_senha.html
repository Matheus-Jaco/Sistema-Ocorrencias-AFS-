{% extends "base.html" %}

{% block title %}Alterar Senha - Sistema de Ocorrências Escolares AFS{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Alterar Senha</h1>
            <p class="text-gray-600 mt-2">Atualize sua senha para manter sua conta segura</p>
        </div>
        
        <!-- Form Card -->
        <div class="bg-white rounded-lg shadow p-8 space-y-6">
            <form method="POST" action="{{ url_for('auth.alterar_senha') }}" class="space-y-5">
                <!-- Senha Atual -->
                <div>
                    <label for="senha_atual" class="block text-sm font-medium text-gray-700 mb-2">
                        Senha Atual
                    </label>
                    <input
                        type="password"
                        id="senha_atual"
                        name="senha_atual"
                        required
                        placeholder="••••••••"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                    >
                </div>
                
                <!-- Senha Nova -->
                <div>
                    <label for="senha_nova" class="block text-sm font-medium text-gray-700 mb-2">
                        Senha Nova
                    </label>
                    <input
                        type="password"
                        id="senha_nova"
                        name="senha_nova"
                        required
                        placeholder="••••••••"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                    >
                    <p class="text-xs text-gray-500 mt-2">
                        Mínimo 8 caracteres, com letras maiúsculas e números
                    </p>
                </div>
                
                <!-- Confirmar Senha -->
                <div>
                    <label for="confirmar_senha" class="block text-sm font-medium text-gray-700 mb-2">
                        Confirmar Senha
                    </label>
                    <input
                        type="password"
                        id="confirmar_senha"
                        name="confirmar_senha"
                        required
                        placeholder="••••••••"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                    >
                </div>
                
                <!-- Submit -->
                <div class="pt-4">
                    <button
                        type="submit"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition"
                    >
                        Alterar Senha
                    </button>
                </div>
            </form>
            
            <!-- Back Link -->
            <div class="pt-4 border-t border-gray-200">
                <a href="{{ url_for('auth.perfil') }}" class="text-green-600 hover:text-green-700 font-medium">
                    ← Voltar ao Perfil
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
